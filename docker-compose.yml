services:
  # Frontend Next.js
  frontend:
    build:
      context: ./Deals.Web
      dockerfile: Dockerfile
    container_name: dealext-frontend
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=production
      - API_BASE_URL=${API_BASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - CSRF_ENFORCE=${CSRF_ENFORCE}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
    depends_on:
      - api
    networks:
      - dealext-network
    restart: "no"

  # API .NET
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dealext-api
    ports:
      - "5010:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      - Jwt__Key=${Jwt__Key}
      - Jwt__Issuer=${Jwt__Issuer}
      - Jwt__Audience=${Jwt__Audience}
      - Jwt__ExpirationHours=${Jwt__ExpirationHours:-2}
      - Auth__RefreshDays=${Auth__RefreshDays:-90}
      - Cors__AllowedOrigins=${Cors__AllowedOrigins}
      - ITAD__ApiKey=${ITAD__ApiKey}
      - ITAD__BaseUrl=${ITAD__BaseUrl}
      - ITAD__Country=${ITAD__Country}
      - ITAD__RefreshAfterDays=${ITAD__RefreshAfterDays}
      - ITAD__TimeoutSeconds=${ITAD__TimeoutSeconds}
      - ITAD__OfficialShopIds=${ITAD__OfficialShopIds}
      - GgDeals__ApiKey=${GgDeals__ApiKey}
      - GgDeals__BaseUrl=${GgDeals__BaseUrl}
      - GgDeals__Region=${GgDeals__Region}
      - GgDeals__TimeoutSeconds=${GgDeals__TimeoutSeconds}
      - FX__BanxicoToken=${FX__BanxicoToken}
      - FX__BaseUrl=${FX__BaseUrl}
      - FX__BaseCurrency=${FX__BaseCurrency}
      - FX__QuoteCurrency=${FX__QuoteCurrency}
      - FX__TimeoutSeconds=${FX__TimeoutSeconds}
      - Epic__BaseUrl=${Epic__BaseUrl}
      - Epic__Country=${Epic__Country}
      - Epic__Locale=${Epic__Locale}
      - Epic__UserAgent=${Epic__UserAgent}
      - Epic__TimeoutSeconds=${Epic__TimeoutSeconds}
      - Microsoft__BaseUrl=${Microsoft__BaseUrl}
      - Microsoft__Market=${Microsoft__Market}
      - Microsoft__Languages=${Microsoft__Languages}
      - Microsoft__Currency=${Microsoft__Currency}
      - Microsoft__UserAgent=${Microsoft__UserAgent}
      - Microsoft__TimeoutSeconds=${Microsoft__TimeoutSeconds}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET}
      - IGDB_TOKEN=${IGDB_TOKEN}
      - STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY}
      - GlobalBundles__Enabled=${GlobalBundles__Enabled:-true}
      - GlobalBundles__PageSize=${GlobalBundles__PageSize:-50}
      - GlobalBundles__MaxPages=${GlobalBundles__MaxPages:-40}
      - GlobalBundles__RefreshHours=${GlobalBundles__RefreshHours:-12}
      - GlobalBundles__JitterMinutes=${GlobalBundles__JitterMinutes:-10}
      - GlobalBundles__StartupDelaySeconds=${GlobalBundles__StartupDelaySeconds:-120}
      - GlobalBundles__MinHoursBetweenRuns=${GlobalBundles__MinHoursBetweenRuns:-6}
      - GgDealsBundles__Enabled=${GgDealsBundles__Enabled:-false}
      - GgDealsBundles__MaxPages=${GgDealsBundles__MaxPages:-40}
      - GgDealsBundles__CursorValidityMinutes=${GgDealsBundles__CursorValidityMinutes:-60}
      - GgDealsBundles__RefreshHours=${GgDealsBundles__RefreshHours:-24}
      - GgDealsBundles__JitterMinutes=${GgDealsBundles__JitterMinutes:-15}
      - GgDealsBundles__StartupDelaySeconds=${GgDealsBundles__StartupDelaySeconds:-300}
      - GgDealsBundles__MinHoursBetweenRuns=${GgDealsBundles__MinHoursBetweenRuns:-12}
      - GlobalDeals__Enabled=${GlobalDeals__Enabled:-false}
      - GlobalDeals__PageSize=${GlobalDeals__PageSize:-200}
      - GlobalDeals__MaxPages=${GlobalDeals__MaxPages:-20}
      - GlobalDeals__RefreshHours=${GlobalDeals__RefreshHours:-24}
      - GlobalDeals__JitterMinutes=${GlobalDeals__JitterMinutes:-30}
      - GlobalDeals__StartupDelaySeconds=${GlobalDeals__StartupDelaySeconds:-300}
      - GlobalDeals__MinHoursBetweenRuns=${GlobalDeals__MinHoursBetweenRuns:-12}
      - GlobalDeals__MinDiscountPercent=${GlobalDeals__MinDiscountPercent:-50}
      - Ntfy__Enabled=${Ntfy__Enabled:-false}
      - Ntfy__BaseUrl=${Ntfy__BaseUrl:-https://ntfy.amitzi.xyz/}
      - Ntfy__Topic=${Ntfy__Topic:-Deals}
      - Ntfy__AuthToken=${Ntfy__AuthToken:-}
    networks:
      - dealext-network
      - server-data
    restart: "no"

networks:
  dealext-network:
    driver: bridge
  server-data:
    external: true
